<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A cozy 2.5D kitchen filled with playful bite-sized utilities."
    />
    <title>Bite Sized Utilities</title>
    <link rel="icon" href="assets/waffle-cup-mascot.webp" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-calculator" viewBox="0 0 96 96">
        <rect x="17" y="8" width="62" height="80" rx="15" fill="#e78167" stroke="#4f2f23" stroke-width="6" />
        <rect x="27" y="19" width="42" height="18" rx="6" fill="#fff1c9" stroke="#4f2f23" stroke-width="5" />
        <path d="M32 51h6m13 0h6m13 0h1M32 64h6m13 0h6m13 0h1M32 77h6m13 0h6m13 0h1" stroke="#4f2f23" stroke-width="8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-graph" viewBox="0 0 96 96">
        <rect x="9" y="12" width="78" height="70" rx="14" fill="#82bbb6" stroke="#4f2f23" stroke-width="6" />
        <path d="M24 23v45h54M24 56h54M24 41h54M41 23v45M59 23v45" fill="none" stroke="#fff0cb" stroke-width="3" opacity=".9" />
        <path d="M25 64c10-2 13-20 23-19 10 2 10 13 18 10 7-3 8-22 14-25" fill="none" stroke="#b84f42" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-body" viewBox="0 0 96 96">
        <path d="M20 83c0-19 11-31 28-31s28 12 28 31" fill="#91b783" stroke="#4f2f23" stroke-width="6" stroke-linecap="round" />
        <circle cx="48" cy="27" r="17" fill="#f3b26d" stroke="#4f2f23" stroke-width="6" />
        <path d="M39 26h2m14 0h2M40 35c5 4 11 4 16 0" fill="none" stroke="#4f2f23" stroke-width="4" stroke-linecap="round" />
        <path d="M48 59c-9-9-20 3-10 13l10 9 10-9c10-10-1-22-10-13Z" fill="#db6f65" stroke="#4f2f23" stroke-width="4" />
      </symbol>
      <symbol id="icon-fraction" viewBox="0 0 96 96">
        <rect x="18" y="10" width="60" height="76" rx="16" fill="#c6a8ca" stroke="#4f2f23" stroke-width="6" />
        <path d="M30 49h36" stroke="#4f2f23" stroke-width="6" stroke-linecap="round" />
        <circle cx="48" cy="30" r="9" fill="#fff1c9" stroke="#4f2f23" stroke-width="4" />
        <path d="M41 69h14" stroke="#fff1c9" stroke-width="10" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-percent" viewBox="0 0 96 96">
        <path d="M12 25a14 14 0 0 1 14-14h42l17 17-40 54a13 13 0 0 1-18 2L12 72Z" fill="#f0b84f" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <circle cx="61" cy="27" r="6" fill="#fff1c9" stroke="#4f2f23" stroke-width="4" />
        <path d="M31 67 62 38M32 42h1m28 23h1" stroke="#4f2f23" stroke-width="8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-dice" viewBox="0 0 96 96">
        <path d="m19 27 27-15 31 13-27 17Z" fill="#f7d98f" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="m19 27 31 15v40L18 66Z" fill="#df7964" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="m50 42 27-17 1 41-28 16Z" fill="#83b4ad" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="M32 42h1m4 23h1m26-26h1m0 26h1M45 25h1" stroke="#4f2f23" stroke-width="7" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-roman" viewBox="0 0 96 96">
        <path d="M18 13c15 5 28-5 41 0 9 3 14 1 19-1v70c-11 5-21 2-29 0-11-3-20 4-31 0Z" fill="#efd39b" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="M31 29h34M34 66h28" stroke="#b77c49" stroke-width="4" stroke-linecap="round" />
        <path d="m31 38 10 24 8-24m5 0v24m-5-24h12" fill="none" stroke="#4f2f23" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-base" viewBox="0 0 96 96">
        <rect x="7" y="14" width="35" height="31" rx="10" fill="#82bbb6" stroke="#4f2f23" stroke-width="5" />
        <rect x="54" y="51" width="35" height="31" rx="10" fill="#e78167" stroke="#4f2f23" stroke-width="5" />
        <path d="M48 24h21l-7-7m7 7-7 7M48 72H27l7 7m-7-7 7-7" fill="none" stroke="#4f2f23" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M19 26h11M68 63v9m-5-4h10" stroke="#fff1c9" stroke-width="6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-prime" viewBox="0 0 96 96">
        <path d="m48 7 11 23 25 4-18 18 4 26-22-12-22 12 4-26-18-18 25-4Z" fill="#efba4f" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="M39 33h20L47 64" fill="none" stroke="#4f2f23" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-sequence" viewBox="0 0 96 96">
        <rect x="8" y="25" width="25" height="48" rx="8" fill="#e78167" stroke="#4f2f23" stroke-width="5" />
        <rect x="36" y="16" width="25" height="57" rx="8" fill="#f0ba50" stroke="#4f2f23" stroke-width="5" />
        <rect x="64" y="7" width="25" height="66" rx="8" fill="#83b4ad" stroke="#4f2f23" stroke-width="5" />
        <path d="M17 59h7M44 57h9M72 55h9" stroke="#fff1c9" stroke-width="6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-codehub" viewBox="0 0 96 96">
        <rect x="12" y="11" width="72" height="57" rx="13" fill="#82bbb6" stroke="#4f2f23" stroke-width="6" />
        <rect x="22" y="21" width="52" height="37" rx="7" fill="#2f4b49" stroke="#4f2f23" stroke-width="4" />
        <path d="m38 31-9 8 9 8m20-16 9 8-9 8m-7-20-7 24" fill="none" stroke="#f4c25d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M7 70h82l-8 14H15Z" fill="#e78167" stroke="#4f2f23" stroke-width="6" stroke-linejoin="round" />
        <path d="M40 76h16" stroke="#fff1c9" stroke-width="4" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 48 48">
        <path d="m14 14 20 20m0-20L14 34" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
      </symbol>
    </svg>

    <section class="home-screen" id="homeScreen" aria-labelledby="homeTitle">
      <button class="home-wall" id="homeWall" aria-label="Bounce the waffle kitchen wall"></button>
      <div class="home-top-shelf" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <header class="home-header">
        <div class="hanging-rope hanging-rope-left" aria-hidden="true"></div>
        <div class="hanging-rope hanging-rope-right" aria-hidden="true"></div>
        <div class="title-sign home-title-sign">
          <span class="home-title-bite" aria-hidden="true">•</span>
          <div>
            <p>Welcome to the tiny utility kitchen</p>
            <h1 id="homeTitle">Bite Sized<br /><span>Utilities</span></h1>
          </div>
          <span class="home-title-bite" aria-hidden="true">•</span>
        </div>
      </header>

      <main class="home-kitchen">
        <div class="home-stage home-stage-two">
          <div class="home-category-area">
            <p class="home-prompt">Choose a cupboard</p>
            <div class="home-category-grid">
              <div class="home-category-slot">
                <div class="home-cupboard" id="mathHomeCupboard">
                  <div class="home-cupboard-crown" aria-hidden="true"></div>
                  <div class="home-cupboard-frame">
                    <div class="home-cupboard-inside">
                      <span class="home-inside-icon"><svg><use href="#icon-calculator"></use></svg></span>
                      <strong>Math &amp; Numbers</strong>
                      <span>10 tools ready!</span>
                      <span class="home-shelf-board" aria-hidden="true"></span>
                    </div>
                    <button class="home-cupboard-door" id="openMathCupboard" aria-expanded="false" aria-label="Open the Math and Numbers cupboard">
                      <span class="home-door-inset">
                        <span class="home-door-icons" aria-hidden="true">
                          <svg><use href="#icon-calculator"></use></svg>
                          <svg><use href="#icon-prime"></use></svg>
                        </span>
                        <strong>Math <span>&amp;</span><br />Numbers</strong>
                        <small>10 utilities</small>
                      </span>
                      <span class="home-door-knob" aria-hidden="true"></span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="home-category-slot">
                <div class="home-cupboard home-cupboard-code" id="codingHomeCupboard">
                  <div class="home-cupboard-crown" aria-hidden="true"></div>
                  <div class="home-cupboard-frame">
                    <div class="home-cupboard-inside">
                      <span class="home-inside-icon"><svg><use href="#icon-codehub"></use></svg></span>
                      <strong>Coding &amp; Developing</strong>
                      <span>CodeHub is ready!</span>
                      <span class="home-shelf-board" aria-hidden="true"></span>
                    </div>
                    <button class="home-cupboard-door" id="openCodingCupboard" aria-expanded="false" aria-label="Open the Coding and Developing cupboard">
                      <span class="home-door-inset">
                        <span class="home-door-icons home-door-icons-single" aria-hidden="true">
                          <svg><use href="#icon-codehub"></use></svg>
                        </span>
                        <strong>Coding <span>&amp;</span><br />Developing</strong>
                        <small>1 utility</small>
                      </span>
                      <span class="home-door-knob" aria-hidden="true"></span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button class="home-mascot" id="homeMascot" aria-label="Bounce the waffle cup mascot">
            <span class="home-mascot-speech" id="homeMascotSpeech">Two cupboards are ready!</span>
            <img src="assets/waffle-cup-mascot.webp" alt="A cheerful waffle cup filled with hot chocolate" />
          </button>
        </div>
        <div class="home-counter" aria-hidden="true"></div>
      </main>
    </section>

    <div class="game-world math-screen category-screen" id="gameWorld" data-category-screen="math" hidden>
      <button class="waffle-backdrop" id="waffleBackdrop" aria-label="Bounce the waffle wall"></button>

      <nav class="math-nav" aria-label="Kitchen navigation">
        <button class="back-home-button" id="backHome">
          <span aria-hidden="true">←</span>
          Home kitchen
        </button>
      </nav>

      <header class="kitchen-header category-header">
        <div class="hanging-rope hanging-rope-left" aria-hidden="true"></div>
        <div class="hanging-rope hanging-rope-right" aria-hidden="true"></div>
        <div class="title-sign">
          <span class="title-doodle" aria-hidden="true">×</span>
          <div>
            <p>One cupboard. Ten tools.</p>
            <h1>Math <span>&amp;</span> Numbers</h1>
          </div>
          <span class="title-doodle" aria-hidden="true">÷</span>
        </div>
      </header>

      <main class="category-cabinet-scene">
        <section class="open-category-cabinet math-category-cabinet" aria-label="Open Math and Numbers cupboard containing ten utilities">
          <div class="category-cabinet-crown" aria-hidden="true"></div>
          <div class="category-cabinet-frame">
            <div class="category-cabinet-back">
              <div class="category-shelf">
                <button class="shelf-utility" data-tool="calculator" aria-label="Open Calculator">
                  <span class="utility-art utility-art-coral"><svg><use href="#icon-calculator"></use></svg></span>
                  <span>Calculator</span>
                </button>
                <button class="shelf-utility" data-tool="graph" aria-label="Open Graphing Calculator">
                  <span class="utility-art utility-art-teal"><svg><use href="#icon-graph"></use></svg></span>
                  <span>Graphing<br />Calculator</span>
                </button>
              </div>
              <div class="category-shelf">
                <button class="shelf-utility" data-tool="body" aria-label="Open Bodily Calculator">
                  <span class="utility-art utility-art-sage"><svg><use href="#icon-body"></use></svg></span>
                  <span>Bodily<br />Calculator</span>
                </button>
                <button class="shelf-utility" data-tool="fraction" aria-label="Open Fraction Calculator">
                  <span class="utility-art utility-art-lilac"><svg><use href="#icon-fraction"></use></svg></span>
                  <span>Fraction<br />Calculator</span>
                </button>
              </div>
              <div class="category-shelf">
                <button class="shelf-utility" data-tool="percentage" aria-label="Open Percentage Calculator">
                  <span class="utility-art utility-art-honey"><svg><use href="#icon-percent"></use></svg></span>
                  <span>Percentage<br />Calculator</span>
                </button>
                <button class="shelf-utility" data-tool="dice" aria-label="Open Dice Roller">
                  <span class="utility-art utility-art-teal"><svg><use href="#icon-dice"></use></svg></span>
                  <span>Dice Roller</span>
                </button>
              </div>
              <div class="category-shelf">
                <button class="shelf-utility" data-tool="roman" aria-label="Open Roman Numeral Calculator">
                  <span class="utility-art utility-art-parchment"><svg><use href="#icon-roman"></use></svg></span>
                  <span>Roman Numeral<br />Calculator</span>
                </button>
                <button class="shelf-utility" data-tool="base" aria-label="Open Number Base Converter">
                  <span class="utility-art utility-art-coral"><svg><use href="#icon-base"></use></svg></span>
                  <span>Number Base<br />Converter</span>
                </button>
              </div>
              <div class="category-shelf">
                <button class="shelf-utility" data-tool="prime" aria-label="Open Prime Number Checker">
                  <span class="utility-art utility-art-honey"><svg><use href="#icon-prime"></use></svg></span>
                  <span>Prime Number<br />Checker</span>
                </button>
                <button class="shelf-utility" data-tool="sequence" aria-label="Open Sequence Playground">
                  <span class="utility-art utility-art-sage"><svg><use href="#icon-sequence"></use></svg></span>
                  <span>Sequence<br />Playground</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <button class="waffle-mascot waffle-cup-small" id="waffleMascot" aria-label="Bounce the waffle cup mascot">
        <span class="mascot-speech" id="mascotSpeech">Pick a tool!</span>
        <img src="assets/waffle-cup-mascot.webp" alt="A cheerful waffle cup filled with hot chocolate" />
      </button>
    </div>

    <div class="game-world coding-screen category-screen" id="codingWorld" data-category-screen="coding" hidden>
      <button class="waffle-backdrop" id="codingWaffleBackdrop" aria-label="Bounce the waffle wall"></button>

      <nav class="math-nav" aria-label="Kitchen navigation">
        <button class="back-home-button" id="backHomeCoding">
          <span aria-hidden="true">←</span>
          Home kitchen
        </button>
      </nav>

      <header class="kitchen-header category-header">
        <div class="hanging-rope hanging-rope-left" aria-hidden="true"></div>
        <div class="hanging-rope hanging-rope-right" aria-hidden="true"></div>
        <div class="title-sign coding-title-sign">
          <span class="title-doodle" aria-hidden="true">&lt;</span>
          <div>
            <p>Build it. Run it. See it.</p>
            <h1>Coding <span>&amp;</span> Developing</h1>
          </div>
          <span class="title-doodle" aria-hidden="true">/&gt;</span>
        </div>
      </header>

      <main class="category-cabinet-scene coding-cabinet-scene">
        <section class="open-category-cabinet coding-category-cabinet" aria-label="Open Coding and Developing cupboard containing CodeHub">
          <div class="category-cabinet-crown" aria-hidden="true"></div>
          <div class="category-cabinet-frame">
            <div class="category-cabinet-back">
              <div class="category-shelf category-shelf-single">
                <button class="shelf-utility shelf-utility-featured" data-tool="codehub" aria-label="Open CodeHub">
                  <span class="utility-art utility-art-code"><svg><use href="#icon-codehub"></use></svg></span>
                  <span>CodeHub</span>
                  <small>Web · Python · C · C++</small>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <button class="waffle-mascot waffle-cup-small" id="codingMascot" aria-label="Bounce the waffle cup mascot">
        <span class="mascot-speech" id="codingMascotSpeech">CodeHub is ready!</span>
        <img src="assets/waffle-cup-mascot.webp" alt="A cheerful waffle cup filled with hot chocolate" />
      </button>
    </div>

    <div class="tool-overlay" id="toolOverlay" aria-hidden="true">
      <button class="overlay-curtain" id="overlayCurtain" aria-label="Close utility"></button>
      <section class="tool-drawer" role="dialog" aria-modal="true" aria-labelledby="toolTitle">
        <div class="drawer-handle" aria-hidden="true"></div>
        <header class="tool-header">
          <div class="tool-heading-icon" id="toolHeadingIcon"></div>
          <div class="tool-heading-copy">
            <p id="toolCategory">Math &amp; Numbers</p>
            <h2 id="toolTitle"></h2>
          </div>
          <button class="round-close" id="closeTool" aria-label="Back to cupboards">
            <svg><use href="#icon-close"></use></svg>
          </button>
        </header>
        <div class="tool-body" id="toolBody"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="confetti-field" id="confettiField" aria-hidden="true"></div>

    <script src="app.js"></script>
  </body>
</html>
